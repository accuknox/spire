agent {
    data_dir = "./.data"
    log_level = "DEBUG"
    server_address = "localhost"
    server_port = "8081"
    agent_address = "127.0.0.1"
    agent_port = "9091"
    socket_path ="./tmp/spire-agent/public/api.sock"
    #trust_bundle_path = "./conf/agent/dummy_root_ca.crt"
    insecure_bootstrap = true
    trust_domain = "accuknox.com"

    access_key {
        # mode describes the type of onboarding, can be vm, K8s or Node
        mode =""
        # specify the access_key generated from UI
        key = ""
        # URL specifies the access_key processor URL
        url = ""
        # specify the cluster_name, this is mandatory for K8s onboarding
        # specify if onboarding a Node as well
        cluster_name = ""
        # Optional parameter for mode=Node, 
        # will be auto filled as hostname-time_in_unix
        node_name = ""
        # endpoint for access_token url
        endpoint = ""
        insecure = false
    }

}

plugins {
    NodeAttestor "join_token" {
        plugin_data {
        }
    }
    # use keymanager-k8s for K8s based onboarding 
    KeyManager "keymanager-k8s" {
        plugin_cmd = "./bin/keymanager-k8s"
        plugin_data {
            namespace = "spire"
            secretname = "spire-agent-secret-local"
            directory = "./.data"
        }
    }

    # KeyManager "disk" {
    #     plugin_data {
    #         # directory: The directory in which to store the private key.
    #         directory = "./.data"
    #     }
    # }

    WorkloadAttestor "systemd" {
    }
   
}
