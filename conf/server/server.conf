server {
    bind_address = "127.0.0.1"
    bind_port = "8081"
    socket_path = "/tmp/spire-server/private/api.sock"
    trust_domain = "example.org"
    data_dir = "./.data"
    log_level = "DEBUG"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "mysql"
            connection_string = "tcp(localhost:3306)/spire?parseTime=true"
            vault = {
                enabled = true
                server = "http://localhost:8200"
                skip_tls_verify = true
                k8s_auth_path = "kubernetes"
                # namespace = "default"
                # role = "default-role"
                # token_path = "./secret"
                secrets = {
                    path = "secret/data/demo/config"
                    username = "username"
                    password = "password"
                }
            }
        }
    }

    NodeAttestor "join_token" {
        plugin_data {
        }
    }

    NodeAttestor "k8s_psat"{
        plugin_data {
            clusters = {
                "saas" = {
                    service_account_allow_list = ["spire:spire-agent"]
                }
            }
            entries = [
                {
                    id = "spiffe://example.org/saas/service-1"
                    selectors = [
                        "k8s_sat:sa:service-1",
                        "k8s_sat:pod-label:app:service-1"
                    ]
                    x509_ttl = 8400
                    jwt_ttl = 4400
                },
                {
                    id = "spiffe://example.org/saas/service-2"
                    selectors = [
                        "k8s_sat:sa:service-2",
                        "k8s_sat:pod-label:app:service-2"
                    ]
                    x509_ttl = 8400
                    jwt_ttl = 4400
                },
                {
                    id = "spiffe://example.org/saas/service-3"
                    selectors = [
                        "k8s_sat:sa:service-3",
                        "k8s_sat:pod-label:app:service-3"
                    ]
                    x509_ttl = 8400
                    jwt_ttl = 4400
                },
                {
                    id = "spiffe://example.org/saas/service-4"
                    selectors = [
                        "k8s_sat:sa:service-4",
                        "k8s_sat:pod-label:app:service-4"
                    ]
                    x509_ttl = 8400
                    jwt_ttl = 4400
                }
            ]
        }
    }

    KeyManager "memory" {
        plugin_data = {}
    }

    UpstreamAuthority "disk" {
        plugin_data {
            key_file_path = "./conf/server/dummy_upstream_ca.key"
            cert_file_path = "./conf/server/dummy_upstream_ca.crt"
        }
    }
}
