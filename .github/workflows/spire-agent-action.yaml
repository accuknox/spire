name: spire-agent workflow
on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
    - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request_target:
    branches:
    - "*"

permissions:
  contents: read

jobs:
  tag-validate:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: rubenesp87/semver-validation-action@0.1.0
      with:
       version: ${{ github.ref_name }}
  
  vulnerability-scan-agent:
    runs-on: ubuntu-latest
    needs: [tag-validate]
    if: always() && !contains(needs.tag-validate.result, 'failure')
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 
        submodules: recursive
        token: ${{ secrets.SPIRE_SYSTEMD_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker
    - name: Build agent image
      run: |
        GO_VERSION=$(cat .go-version)
        docker buildx build -f ./Dockerfile . --load --tag localhost/spire-agent:latest --platform linux/amd64 --target spire-agent --build-arg="goversion=$GO_VERSION"
      shell: bash
    - name: Download Vulnerability Scanner
      run: |
        curl -sfL $url | sh -s -- -b /usr/local/bin > /dev/null
      env:
        url: https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh
      shell: bash
    - name: Run Vulnerability Scanner
      run: |
        $Scan image \
          --severity CRITICAL,HIGH \
          -f json localhost/spire-agent:latest \
          -o results.json \
          --quiet \
          --skip-dirs /usr/local/bin,/usr/bin,/usr/local/lib/node_modules
      env:
        Scan: trivy
      shell: bash

    - name: Print Vulnerability Results
      run: cat results.json
      shell: bash
    - name: Exit on Vulnerabilities
      run: |
        if grep -qE '"Severity":\s*"(CRITICAL|HIGH)"' results.json; then
          exit 1
        fi
